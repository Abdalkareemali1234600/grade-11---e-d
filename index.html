<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>حادي عشر علمي هـ ، و</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: masthead + tatreez band, sticky tab bar, one column. The live "now" card is the single bold element. */
:root{
  color-scheme:dark;
  --bg:#0a1315; --surface:#101e21; --surface2:#162a2e; --line:#243b3f;
  --fg:#e9f0ea; --muted:#93aaa9;
  --accent:#e2b255; --on-accent:#1a1302; --teal:#55bfae;
  --bad:#ef8b7a; --ok:#79d39c; --glow:rgba(226,178,85,.11);
  --sub-a:.17; --sub-l:64%; --sub-s:60%;
  --font-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#eff3ee; --surface:#fcfdfb; --surface2:#e6ede7; --line:#ccd8cf;
    --fg:#112629; --muted:#506768;
    --accent:#8c5e08; --on-accent:#ffffff; --teal:#14695c;
    --bad:#b5412f; --ok:#1f7a45; --glow:rgba(140,94,8,.09);
    --sub-a:.14; --sub-l:36%; --sub-s:62%;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eff3ee; --surface:#fcfdfb; --surface2:#e6ede7; --line:#ccd8cf;
  --fg:#112629; --muted:#506768;
  --accent:#8c5e08; --on-accent:#ffffff; --teal:#14695c;
  --bad:#b5412f; --ok:#1f7a45; --glow:rgba(140,94,8,.09);
  --sub-a:.14; --sub-l:36%; --sub-s:62%;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font:400 15px/1.65 var(--font-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1040px;margin-inline:auto;min-width:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 6px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{position:relative;width:60px;height:60px;display:grid;place-items:center;flex:none}
.mark::before,.mark::after{content:"";position:absolute;inset:7px;border:1.5px solid var(--accent);transform:rotate(45deg);border-radius:3px}
.mark::after{inset:14px;opacity:.5}
.mark b{position:relative;font:700 18px/1 var(--font-display);color:var(--fg);letter-spacing:.02em}
.brand h1{font:700 clamp(24px,5vw,34px)/1.15 var(--font-display)}
.brand p{color:var(--muted);font-size:14px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font:600 13px var(--font-body)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:18px;height:18px}
.clocks{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px 4px}
.clock{display:inline-flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted)}
.clock .mono{color:var(--fg);font-size:13px}
.strip{height:33px;color:var(--accent);opacity:.5;overflow:hidden;margin-block:10px 14px}
.strip svg{display:block;width:100%;height:33px}
.strip.small{height:33px;margin-block:30px 8px}

/* announcement bar */
.annbar{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 14px;margin-bottom:12px;cursor:pointer;min-width:0}
.annbar:hover{background:var(--surface2)}
.annbar .tag{flex:none;font-size:12px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 10px}
.annbar .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:9px 15px;border-radius:999px;border:1px solid transparent;background:none;color:var(--muted);font:500 14px var(--font-body);cursor:pointer}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--surface2);border-color:var(--line);color:var(--fg)}
.tab[aria-selected="true"] svg{color:var(--accent)}
.panel{padding-block:22px 10px;display:flex;flex-direction:column;gap:20px;min-width:0}
.panel>*{min-width:0}
.head{display:flex;flex-direction:column;gap:4px}
.h2{font:600 clamp(20px,3.6vw,27px)/1.25 var(--font-display)}
.lead{color:var(--muted);max-width:64ch;font-size:14.5px}
.h3{font:600 17px/1.3 var(--font-display)}

/* now card */
.now{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,var(--surface2),var(--surface));padding:24px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center}
.now::before{content:"";position:absolute;inset-inline-end:-80px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.now>*{position:relative;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.now[data-k="live"] .pill{color:var(--accent);border-color:var(--accent)}
.now[data-k="live"] .pill i{background:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.now .subj{font:700 clamp(28px,6vw,46px)/1.12 var(--font-display);margin-block:12px 6px}
.now .meta{color:var(--muted);font-size:14.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.now .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.cdwrap{display:flex;flex-direction:column;gap:6px}
.cdcap{color:var(--muted);font-size:13.5px}
.cd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cd .t{font:500 clamp(34px,8vw,58px)/1 var(--font-mono);letter-spacing:-.02em}
.cd .d{font-size:15px;color:var(--accent);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .6s}
@media (max-width:720px){.now{grid-template-columns:minmax(0,1fr);padding:20px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:600 14px var(--font-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--bg);border-color:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}

/* segmented + chips */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface);gap:2px;max-width:100%}
.seg button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:9px;font:500 13.5px var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;min-width:0;max-width:100%}
.row>.chips{flex:1 1 280px}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 14px;font:500 13.5px var(--font-body);cursor:pointer}
.fchip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border-radius:999px;background:hsl(var(--h) 55% var(--sub-l)/var(--sub-a));font-weight:600;font-size:14px;max-width:100%}
.chip::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:hsl(var(--h) var(--sub-s) var(--sub-l))}

/* days + periods */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:1 0 auto;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;border-radius:14px;cursor:pointer;font:600 14px var(--font-body)}
.day small{font:500 11.5px var(--font-body);color:var(--muted)}
.day.off{opacity:.62}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.day.today small{color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:2px}
.period{display:grid;grid-template-columns:44px minmax(150px,210px) minmax(0,1fr) auto;grid-template-areas:"no time subj join";gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.period.live{border-color:var(--accent);background:linear-gradient(160deg,var(--glow),var(--surface))}
.period .no{grid-area:no;font:600 22px var(--font-display);color:var(--muted);text-align:center}
.period.live .no{color:var(--accent)}
.period .time{grid-area:time;font-size:14px}
.period .sj{grid-area:subj;display:flex;flex-direction:column;gap:2px;min-width:0;align-items:flex-start}
.period .sj small{color:var(--muted);font-size:13px}
.period .join{grid-area:join}
.flag{font-size:12px;font-weight:600;color:var(--accent)}
@media (max-width:640px){
  .period{grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"no subj join" "no time time";gap:8px 12px}
}
.brk{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;padding-block:6px}
.brk::before,.brk::after{content:"";flex:1;border-top:1px dashed var(--line)}
.offcard{border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.offcard b{font:600 20px var(--font-display);color:var(--fg)}

/* week table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.wk{border-collapse:separate;border-spacing:6px;width:100%;min-width:660px}
.wk th{font:600 13px var(--font-body);color:var(--muted);padding:6px 4px;text-align:center;white-space:nowrap}
.wk th.today{color:var(--accent)}
.wk td{padding:8px 6px;text-align:center;border-radius:10px;background:var(--surface2);vertical-align:middle}
.wk td.pn{background:none;text-align:start;font-size:12.5px;color:var(--muted);white-space:nowrap}
.wk td.pn b{display:block;color:var(--fg);font:600 14px var(--font-body)}
.wk td.today{outline:1px solid var(--accent)}
.wk td.wknd{background:none;border:1px dashed var(--line);color:var(--muted);font-size:13px}
.wk .chip{font-size:13px;padding:2px 10px}

/* link card */
.linkcard{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 16px}
.linkcard .u{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;user-select:all;direction:ltr;text-align:start;display:block;max-width:100%}
.linkcard>div{min-width:0;flex:1 1 260px}

/* cards, forms */
.card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px;font:400 15px var(--font-body);min-width:0}
textarea.in{resize:vertical;min-height:84px;line-height:1.6}
.in:focus-visible{outline-offset:0;border-color:var(--teal)}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.note{border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:14px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.empty b{color:var(--fg);font:600 17px var(--font-display)}

/* homework */
.list{display:flex;flex-direction:column;gap:12px}
.stamp{border:1px solid var(--line);border-radius:14px;background:var(--surface2);text-align:center;padding:8px 4px;align-self:start}
.stamp .dn{font:500 26px/1.1 var(--font-mono)}
.stamp .mn{font-size:12.5px;color:var(--muted)}
.stamp .rl{font-size:11.5px;font-weight:600;margin-top:4px;color:var(--muted)}
.stamp.soon .rl{color:var(--accent)}
.stamp.late .rl{color:var(--bad)}
.prog{font-size:13.5px;color:var(--muted)}
.hw{border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden}
.hw.done .hwtop{opacity:.6}
.hw.closed{border-style:dashed}
.hwrow{display:flex;gap:10px;align-items:center;padding:14px 16px}
.hwtop{flex:1;min-width:0;display:grid;grid-template-columns:76px minmax(0,1fr) 20px;gap:14px;align-items:center;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.hwtop .mid{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.hwtop h3{font:600 17px/1.45 var(--font-body);overflow-wrap:anywhere}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.hw.open .chev{transform:rotate(180deg)}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;border:1px solid var(--bad);color:var(--bad)}
.donebtn{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.donebtn svg{width:22px;height:22px}
.donebtn:hover{border-color:var(--ok);color:var(--ok)}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.hwbody{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border-top:1px solid var(--line)}
.hwbody .det{white-space:pre-wrap;overflow-wrap:anywhere}
.hwbody .att img{display:block;max-width:100%;max-height:560px;border-radius:12px;border:1px solid var(--line)}
.closenote{border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.hwacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hwdate{font-size:13px;color:var(--muted)}
@media (max-width:480px){.hwtop{grid-template-columns:62px minmax(0,1fr) 20px;gap:10px}.hwrow{padding:12px}}
.durs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.durs label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.guide{display:flex;flex-direction:column;gap:12px}

/* teachers */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.tc{display:flex;flex-direction:column;gap:12px}
.tc .nm{font:600 18px/1.4 var(--font-body);overflow-wrap:anywhere}
.tc .role{font-size:13px;color:var(--muted)}
.acc{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);min-width:0}
.acc span{direction:ltr;text-align:start;font-size:12.5px;overflow-wrap:anywhere;user-select:all;min-width:0}
.tc .acts{display:flex;gap:8px;flex-wrap:wrap}
.load{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 24px;gap:12px;align-items:center;font-size:14px}
.lrow .lb{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.lrow .lb i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) var(--sub-s) var(--sub-l))}
.lrow .mono{text-align:end}

/* help */
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font:600 15px var(--font-mono)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.tips{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.timer .big{font:500 clamp(46px,12vw,72px)/1 var(--font-mono);letter-spacing:-.02em}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0}
details+details{margin-top:8px}
summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font:500 20px/1 var(--font-mono)}
details[open] summary::after{content:"–"}
details p{padding:0 16px 14px;color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap}

/* forum */
.ann{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px}
.ann.pin{border-color:var(--accent);background:linear-gradient(160deg,var(--glow),var(--surface))}
.ann h3{font:600 17px/1.4 var(--font-body)}
.ann .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.ann .mt{font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.post{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who img{width:34px;height:34px;border-radius:50%;flex:none;border:1px solid var(--line)}
.who .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .w{font-size:12.5px;color:var(--muted)}
.post .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.cat{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);margin-inline-start:auto;flex:none}
.pacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.replies{display:flex;flex-direction:column;gap:10px;border-inline-start:2px solid var(--line);padding-inline-start:14px;margin-inline-start:6px}

      subj.textContent=t(labels[st.k]);
      $('nowTeacher').textContent=t('nextLine',{s:sk?SUBJ[sk][lang]:''});
    }
    $('cdCap').textContent=st.k==='live'?t('endsIn'):(st.k==='done'||st.k==='off'?t('nextIn'):t('startsIn'));
    $('cdBar').hidden=st.k!=='live';
    renderDayList();renderWeek();renderDays();
  }
  var days=Math.floor(Math.max(0,st.left)/86400),cdD=$('cdDays');
  cdD.hidden=days===0;
  if(days>0)cdD.textContent=lang==='ar'?days+' يوم':days+(days===1?' day':' days');
  $('cdT').textContent=cdStr(st.left);
  if(st.k==='live')$('cdFill').style.width=Math.min(100,Math.max(0,100-(st.left/st.total)*100))+'%';
}

/* ---------- help ---------- */
function numPref(k,d,lo,hi){var v=parseInt(store.get(k,''),10);return isFinite(v)&&v>=lo&&v<=hi?v:d}
var timer={mode:'focus',fm:numPref('hub.tf',25,1,240),rm:numPref('hub.tr',5,1,60),left:0,run:false,iv:null};
function modeSecs(){return (timer.mode==='focus'?timer.fm:timer.rm)*60}
timer.left=modeSecs();
function paintTimer(){
  var m=Math.floor(timer.left/60),s=timer.left%60;
  $('timerBig').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('timerGo').textContent=timer.run?t('tPause'):t('tStart');
  $('timerReset').textContent=t('tReset');
  var seg=$('timerSeg');seg.replaceChildren();
  [['focus','tFocus'],['rest','tRest']].forEach(function(o){seg.append(h('button',{type:'button','aria-pressed':String(timer.mode===o[0]),text:t(o[1]),onclick:function(){stopTimer();timer.mode=o[0];timer.left=modeSecs();paintTimer()}}))});
}
function stopTimer(){timer.run=false;clearInterval(timer.iv);timer.iv=null}
function bindDur(id,key,prop,lo,hi,mode){
  var el=$(id);el.value=timer[prop];
  el.addEventListener('input',function(){
    var v=parseInt(el.value,10);if(!isFinite(v))return;
    v=Math.min(hi,Math.max(lo,v));timer[prop]=v;store.set(key,String(v));
    if(!timer.run&&timer.mode===mode){timer.left=v*60;paintTimer()}
  });
  el.addEventListener('change',function(){el.value=timer[prop]});
}
bindDur('tmFocus','hub.tf','fm',1,240,'focus');bindDur('tmRest','hub.tr','rm',1,60,'rest');
$('timerGo').addEventListener('click',function(){
  if(timer.run){stopTimer();paintTimer();return}
  timer.run=true;
  timer.iv=setInterval(function(){
    timer.left--;
    if(timer.left<=0){stopTimer();timer.mode=timer.mode==='focus'?'rest':'focus';timer.left=modeSecs();toast(timer.mode==='rest'?t('tRest'):t('tFocus'))}
    paintTimer();
  },1000);
  paintTimer();
});
$('timerReset').addEventListener('click',function(){stopTimer();timer.left=modeSecs();paintTimer()});

/* ---------- date helpers for homework / forum ---------- */
function todayStr(){var g=zp(new Date(),PS);return g.y+'-'+String(g.mo).padStart(2,'0')+'-'+String(g.d).padStart(2,'0')}
function dayDiff(due){
  var a=due.split('-').map(Number),b=todayStr().split('-').map(Number);
  return Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(b[0],b[1]-1,b[2]))/86400000);
}
function ago(ts){
  var s=Math.round((ts-Date.now())/1000),a=Math.abs(s);
  if(a<60)return t('justNow');
  var r=new Intl.RelativeTimeFormat(L(),{numeric:'auto'});
  if(a<3600)return r.format(Math.round(s/60),'minute');
  if(a<86400)return r.format(Math.round(s/3600),'hour');
  if(a<86400*7)return r.format(Math.round(s/86400),'day');
  return new Intl.DateTimeFormat(L(),{day:'numeric',month:'short'}).format(new Date(ts));
}
function confirmBtn(label,sure,fn,cls){
  var b=h('button',{class:'btn sm danger '+(cls||''),type:'button',text:label});var armed=false,tm=null;
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.textContent=sure;b.classList.add('arm');tm=setTimeout(function(){armed=false;b.textContent=label;b.classList.remove('arm')},3500);return}
    clearTimeout(tm);b.disabled=true;fn();
  });
  return b;
}
function notice(el,msg){el.replaceChildren();if(msg)el.append(h('div',{class:'note',text:msg}))}
function emptyBox(title,desc,extra){return h('div',{class:'empty'},h('b',{text:title}),h('span',{text:desc}),extra?h('span',{text:extra}):null)}

/* ---------- homework ---------- */
function saveDone(){store.set('hub.done',JSON.stringify(S.done))}
function hwDiff(x){return x.due?dayDiff(x.due):null}
function hwLate(x){var d=hwDiff(x);return !!x.closed||(d!==null&&d<0)}
function safeUrl(u){return typeof u==='string'&&/^https:\/\//i.test(u)?u:null}
function attSrc(a){
  if(!a)return null;
  if(a.src&&/^[A-Za-z0-9_.\-]+$/.test(a.src))return a.src;
  if(a.id)return '/_blob/'+encodeURIComponent(a.id);
  return null;
}
function renderHw(){
  var nt=$('hwNotice');
  notice(nt,S.dbErr?t('loadErr'):'');
  $('hwComposer').hidden=!(S.db&&S.canEdit);
  var sel=$('hwSubject');if(sel.options.length!==SUBJ_ORDER.length||sel.getAttribute('data-l')!==lang){
    var cur=sel.value;sel.replaceChildren();SUBJ_ORDER.forEach(function(k){sel.append(h('option',{value:k,text:SUBJ[k][lang]}))});sel.value=cur||'phys';sel.setAttribute('data-l',lang)}
  $('hwSubmit').textContent=t('hwPost');
  var ch=$('hwChips');ch.replaceChildren();
  [['all']].concat(SUBJ_ORDER.map(function(k){return [k]})).forEach(function(o){
    var k=o[0];ch.append(h('button',{class:'fchip',type:'button','aria-pressed':String(S.hwFilter===k),text:k==='all'?t('all'):SUBJ[k][lang],onclick:function(){S.hwFilter=k;renderHw()}}));
  });
  var items=S.hw.filter(function(x){return S.hwFilter==='all'||x.subject===S.hwFilter});
  items.sort(function(a,b){
    var la=hwLate(a),lb=hwLate(b);if(la!==lb)return la?1:-1;
    var da=hwDiff(a),db_=hwDiff(b);
    if(la){da=da===null?-1:da;db_=db_===null?-1:db_;return db_-da}
    da=da===null?9999:da;db_=db_===null?9999:db_;return da-db_;
  });
  var up=S.hw.filter(function(x){return !hwLate(x)}),dn=up.filter(function(x){return S.done[x.id]}).length;
  $('hwProg').textContent=up.length?t('prog',{n:dn,m:up.length}):'';
  var box=$('hwList');box.replaceChildren();
  if(!items.length){box.append(emptyBox(t('hwEmptyT'),t('hwEmptyD'),S.canEdit?t('hwEmptyAdmin'):''));return}
  items.forEach(function(x){
    var late=hwLate(x),d=hwDiff(x),open=!!S.hwOpen[x.id],isDone=!!S.done[x.id],stamp,full='';
    if(x.due){
      var parts=x.due.split('-').map(Number),dt=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
      var mn=new Intl.DateTimeFormat(L(),{month:'short',timeZone:'UTC'}).format(dt);
      var rel=late?t('overdue'):(d===0?t('today'):new Intl.RelativeTimeFormat(L(),{numeric:'auto'}).format(d,'day'));
      stamp=h('div',{class:'stamp'+(late?' late':(d<=1?' soon':''))},h('div',{class:'dn',text:String(parts[2])}),h('div',{class:'mn',text:mn}),h('div',{class:'rl',text:rel}));
      full=new Intl.DateTimeFormat(L(),{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(dt);
    }else{
      stamp=h('div',{class:'stamp'+(late?' late':'')},h('div',{class:'dn',text:'—'}),h('div',{class:'mn',text:''}),h('div',{class:'rl',text:late?t('overdue'):''}));
    }
    var chev=icon('chev');chev.setAttribute('class','chev');
    var top=h('button',{class:'hwtop',type:'button','aria-expanded':String(open),'aria-controls':'hb-'+x.id,onclick:function(){S.hwOpen[x.id]=!S.hwOpen[x.id];renderHw()}},
      stamp,
      h('div',{class:'mid'},SUBJ[x.subject]?subjChip(x.subject):null,h('h3',{text:x.title}),late?h('span',{class:'badge',text:t('closedBadge')}):null),
      chev);
    var dbtn=h('button',{class:'donebtn',type:'button','aria-pressed':String(isDone),'aria-label':t('done'),title:t('done'),onclick:function(){if(S.done[x.id])delete S.done[x.id];else S.done[x.id]=1;saveDone();renderHw()}},icon('check'));
    var art=h('article',{class:'hw'+(open?' open':'')+(isDone?' done':'')+(late?' closed':'')},h('div',{class:'hwrow'},top,dbtn));
    if(open){
      var body=h('div',{class:'hwbody',id:'hb-'+x.id});
      if(late)body.append(h('div',{class:'closenote',text:t('closedNote')}));
      if(x.details)body.append(h('div',{class:'det',text:x.details}));
      var src=attSrc(x.att);
      if(src){
        if((x.att.type||'').indexOf('image/')===0)body.append(h('a',{class:'att',href:src,target:'_blank',rel:'noopener noreferrer'},h('img',{src:src,alt:x.att.name||'',loading:'lazy'})));
        else body.append(h('div',null,h('a',{class:'btn sm',href:src,target:'_blank',rel:'noopener noreferrer',text:t('attOpen')+(x.att.name?' · '+x.att.name:'')})));
      }
      var lu=safeUrl(x.link&&x.link.url);
      if(lu)body.append(h('div',null,h('a',{class:'btn pri',href:lu,target:'_blank',rel:'noopener noreferrer'},icon('send'),(x.link.label||t('sendHw')))));
      var acts=h('div',{class:'hwacts'});
      if(full)acts.append(h('span',{class:'hwdate',text:full}));
      if(S.canEdit){
        acts.append(h('button',{class:'btn sm',type:'button',text:x.closed?t('reopen'):t('closeHw'),onclick:function(){S.db.doc('homework/'+x.id).update({closed:!x.closed}).catch(function(){toast(t('saveErr'))})}}));
        acts.append(confirmBtn(t('del'),t('delSure'),function(){S.db.doc('homework/'+x.id).delete().catch(function(){toast(t('saveErr'))})}));
      }
      if(acts.childNodes.length)body.append(acts);
      art.append(body);
    }
    box.append(art);
  });
}

/* ---------- capabilities ---------- */
async function initCaps(){
  var att=$('hwAttachWrap');if(att)att.hidden=true;
  async function load(){
    try{
      var r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('http '+r.status);
      var d=await r.json();
      var fix=function(x){if(!x.createdAt)x.createdAt=x.date?Date.parse(x.date+'T12:00:00'):0;return x};
      S.hw=(d.homework||[]).filter(function(x){return x&&x.title&&x.id}).map(fix);
      S.ann=(d.announcements||[]).filter(function(x){return x&&x.title&&x.id}).map(fix);
      S.dbErr=false;
    }catch(e){S.dbErr=true}
    renderHw();renderForum();
  }
  await load();
  setInterval(load,120000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
}
